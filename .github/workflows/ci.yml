name: CI

on:
  # Only the default branch on push: pull_request already covers every branch that has
  # one open, and listening for both ran the whole matrix twice on each PR commit.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # pdfjs-dist requires >=22.13; 24 is the next line it supports.
        node: ['22.13', '24']

    steps:
      - uses: actions/checkout@v4
        with:
          # The version check compares against the version already on main, which a
          # shallow checkout of the branch alone cannot see.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Version consistency
        run: npm run test:versions

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: OCR page-assembly tests
        run: npm run test:ocr-pdf

      # ocrmypdf is not installed on this runner, on purpose — the OCR companion is meant
      # to work without anydoc itself ever depending on it. These tests cover that real
      # absence plus the rest of the pipeline against a stub in test/fake-bin.
      - name: OCR pipeline tests
        run: npm run test:ocr

      # The generated corpus, whose snapshots are committed. The private corpus of real
      # documents cannot run here, and a layer nobody can run is no signal at all.
      - name: Corpus snapshots
        run: npm run corpus
